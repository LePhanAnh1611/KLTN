server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Pilot — một địa chỉ công khai duy nhất: trình duyệt gọi /api và /uploads
    # trên CÙNG nguồn với trang, nginx chuyển tiếp vào backend trong mạng compose.
    # Nhờ vậy chỉ cần mở MỘT cổng ra Internet (qua tunnel) và không vướng CORS.
    # `^~` để regex tĩnh bên dưới (*.png...) không giành mất ảnh đại diện /uploads.
    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;      # gợi ý hôm nay chấm DKT cả thư viện, có thể chậm
        client_max_body_size 20m;     # tải ảnh / PDF
    }
    location ^~ /uploads/ {
        proxy_pass http://backend:8000;
    }
    location = /health {
        proxy_pass http://backend:8000;
    }

    # SPA: mọi đường dẫn không phải file tĩnh đều trả index.html để React Router xử lý
    location / {
        try_files $uri $uri/ /index.html;

        # index.html KHÔNG được cache: nó là chỗ duy nhất trỏ tới tên file bundle
        # mới. Nếu trình duyệt giữ bản cũ thì deploy xong người dùng vẫn thấy
        # giao diện cũ dù bundle mới đã nằm trên máy chủ.
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Bundle có hash trong tên nên đổi nội dung là đổi tên file -> cache dài vô hại
    location ~* \.(js|css|png|jpg|jpeg|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
